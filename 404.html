<!DOCTYPE html>
<html lang="ja" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 Not Found | Yuuki's DevLab</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Noto+Sans+JP:wght@400;500;700&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    .not-found-wrapper {
      min-height: 80vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px 20px;
    }
    .error-code {
      font-family: var(--font-mono);
      font-size: clamp(5rem, 15vw, 8.5rem);
      font-weight: 800;
      line-height: 1;
      letter-spacing: -0.04em;
      background: linear-gradient(135deg, #6366f1 0%, #ec4899 50%, #06b6d4 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 12px;
    }
    .error-title {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 12px;
    }
    .error-desc {
      color: var(--text-muted);
      max-width: 460px;
      margin-bottom: 28px;
      font-size: 0.95rem;
    }
    .back-home-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 12px 24px;
      background: var(--accent-primary);
      color: #ffffff;
      border-radius: var(--radius-md);
      text-decoration: none;
      font-weight: 600;
      box-shadow: 0 4px 14px rgba(99, 102, 241, 0.4);
      transition: all var(--trans-fast);
    }
    .back-home-btn:hover {
      background: var(--accent-primary-hover);
      transform: translateY(-2px);
    }
  </style>
</head>
<body>
  <div class="bg-glow bg-glow-1"></div>
  <div class="bg-glow bg-glow-2"></div>

  <div class="portal-container">
    <div class="not-found-wrapper">
      <div class="error-code">404</div>
      <h1 class="error-title">ページが見つかりませんでした</h1>
      <p class="error-desc">お探しのページは移動または削除された可能性があります。URLをご確認いただくか、トップページからツールをお探しください。</p>
      <a href="./index.html" class="back-home-btn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="19" y1="12" x2="5" y2="12"/>
          <polyline points="12 19 5 12 12 5"/>
        </svg>
        <span>トップページに戻る</span>
      </a>
    </div>
  </div>
</body>
</html>
